<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111315"><title>VX Arena Mobile v0.4</title><style>:root{--bg:#111315;--panel:#1b1f23;--line:#33383d;--text:#f8f9fa;--muted:#9ea5af;--orange:#ffa948;--red:#ee4654}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}section{display:none;min-height:100dvh}section.active{display:block}.portrait{padding:max(env(safe-area-inset-top),22px) 20px max(env(safe-area-inset-bottom),22px);max-width:520px;margin:auto}.bar{height:42px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:850;letter-spacing:-.04em}.brand b{color:var(--orange)}.icon{background:#22272c;border:1px solid #373c42;color:white;border-radius:12px;width:40px;height:40px}.primary{border:0;background:var(--orange);color:#181a1c;border-radius:12px;font-size:16px;font-weight:750;width:100%;padding:18px}.hero{margin:33px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.hero strong{font-size:22px}.hero small{color:var(--muted)}.tile{display:flex;align-items:center;gap:14px;background:#1b2025;border:1px solid #30363c;border-radius:15px;padding:17px;margin-top:13px;width:100%;color:white;text-align:left}.tile .symbol{width:40px;height:40px;background:#292f34;border-radius:11px;display:grid;place-items:center;font-size:20px}.tile strong{display:block;font-size:15px}.tile small{display:block;font-size:12px;color:#9fa8b2;margin-top:5px}.sectiontitle{font-weight:750;margin:26px 0 12px}.match{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #30363d;font-size:14px}.muted{color:var(--muted);font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#191d21;border-top:1px solid #31363c;display:flex;justify-content:space-around;align-items:center}.nav button{border:0;background:none;color:#909ba7;font-size:12px}.nav button.current{color:var(--orange)}.field{margin:18px 0}.field label{display:block;color:#adb5c0;font-size:13px;margin-bottom:9px}.field input,.field select{width:100%;padding:15px 13px;background:#24292e;color:white;border:1px solid #383f46;border-radius:11px;outline:0}.startbottom{position:sticky;bottom:0;background:linear-gradient(transparent,#111315 15%);padding:24px 0 12px}.prod{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#08090a}.view{position:absolute;inset:0;background:linear-gradient(160deg,#343c43,#14191d 55%,#64503b);touch-action:none}.view:before{content:'CAMERA PREVIEW';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#e5e9ed55;letter-spacing:.16em;pointer-events:none}.view.real:before{display:none}video{display:none;width:100%;height:100%;object-fit:cover}.view.real video{display:block}.side{position:absolute;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}.side.left{left:max(8px,env(safe-area-inset-left))}.side.right{right:max(8px,env(safe-area-inset-right))}.side button{min-width:49px;min-height:48px;color:white;background:#14171ad9;border:1px solid #ffffff36;border-radius:12px;font-size:11px;font-weight:700;backdrop-filter:blur(12px)}.side button .pict{font-size:21px;display:block;margin-bottom:3px}.side button.red{color:#ff6371}.scorebug{position:absolute;bottom:max(11px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:13px;align-items:center;background:#101317e8;border:1px solid #ffffff30;border-radius:12px;padding:7px 14px;white-space:nowrap;backdrop-filter:blur(14px);font-size:12px;max-width:60vw}.scorebug strong{font-size:21px}.scorebug .clock{display:grid;text-align:center;font-size:12px}.scorebug .clock small{color:#aeb5bb}.zoom{position:absolute;left:max(67px,env(safe-area-inset-left));bottom:max(17px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:5px}.zoom button{background:#14171bda;color:#d8dce0;border:1px solid #ffffff2e;border-radius:50%;width:37px;height:37px;font-size:12px}.zoom button.chosen{color:#111;background:var(--orange);border-color:var(--orange)}.zoomdial{position:absolute;bottom:47px;left:0;border-radius:16px;padding:12px;background:#171b1eef;border:1px solid #ffffff35;display:none;width:230px;backdrop-filter:blur(16px)}.zoomdial.show{display:block}.zoomdial input{width:100%;accent-color:var(--orange)}.focus{position:absolute;z-index:2;display:none;width:70px;height:70px;border:2px solid #ffd24e;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0008}.focus.show{display:block}.focus span{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;color:#ffd24e}.overlay{position:absolute;inset:0;z-index:12;background:#0007;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.dialog{width:min(520px,75vw);max-height:92vh;overflow:auto;border-radius:20px;background:#202429ee;border:1px solid #59616a;padding:16px;backdrop-filter:blur(18px)}.dtop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#353b42;color:white;border-radius:10px;font-size:17px;width:35px;height:35px}.scores{display:grid;grid-template-columns:1fr 110px 1fr;gap:10px;text-align:center;align-items:center;margin-top:12px}.scores h2{font-size:28px;margin:5px}.points{display:flex;gap:5px;justify-content:center}.points button{border:1px solid #444b53;background:#30363d;color:white;padding:11px 9px;border-radius:10px;min-width:30px}.midclock{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}.clockbutton{border:1px solid #ffaa48;background:transparent;color:var(--orange);border-radius:50%;width:62px;height:62px;font-size:25px;margin-top:10px}.options{margin-top:14px}.options label{font-size:13px;color:#aeb7c0}.options select{width:100%;background:#2c3238;color:white;padding:12px;border:1px solid #444b53;border-radius:10px;margin:8px 0 10px}.toast{position:fixed;z-index:99;left:50%;top:18px;transform:translateX(-50%);background:#30373ee8;color:white;border-radius:11px;padding:9px 13px;font-size:12px;display:none;white-space:nowrap}.rotate{display:none;position:fixed;inset:0;z-index:50;background:#111315;align-items:center;justify-content:center;text-align:center;padding:30px}.rotate button{padding:10px 18px;border-radius:10px;border:1px solid #444;background:#222;color:white}@media(orientation:portrait){#production.active .rotate{display:flex}}@media(max-height:440px){.side{gap:5px}.side button{min-height:40px}.scores h2{font-size:23px}.dialog{padding:10px}.scorebug{padding:5px 10px}.zoom{bottom:8px}}</style></head><body><div class="toast" id="toast"></div><section id="home" class="active"><div class="portrait" style="padding-bottom:100px"><div class="bar"><span class="brand"><b>VX</b> ARENA</span><button class="icon" onclick="notice('App 設定將在正式版加入')">⚙</button></div><div class="hero"><div><strong>開始今天的比賽</strong><br><small>選擇你的製作方式</small></div></div><button class="primary" onclick="page('setup')">▣　開始新比賽　→</button><button class="tile" onclick="notice('賽事加入與 QR 功能將在後續版本加入')"><span class="symbol">▤</span><span><strong>加入賽事 / 掃碼</strong><small>以拍攝或計分員身份加入</small></span></button><div class="sectiontitle">裝置建議</div><button class="tile" onclick="notice('1080p30 為原型預設，不是實機性能測試結果')"><span class="symbol">◉</span><span><strong>Standard · 1080p30</strong><small>原型預設／正式版會自動測試硬體</small></span></button><div class="sectiontitle">最近比賽</div><div class="match"><span>Tigers vs Lions<br><span class="muted">籃球 · 草稿示例</span></span><button class="icon" onclick="page('setup')">›</button></div></div><nav class="nav"><button class="current" onclick="page('home')">⌂<br>首頁</button><button onclick="notice('賽事管理將在後續版本加入')">▦<br>賽事</button><button onclick="notice('媒體庫將在後續版本加入')">▤<br>媒體庫</button><button onclick="notice('帳號功能將在後續版本加入')">◯<br>我的</button></nav></section><section id="setup"><div class="portrait"><div class="bar"><button class="icon" onclick="page('home')">‹</button><b>建立比賽</b><span style="width:40px"></span></div><div class="field"><label>運動</label><select><option>🏀 籃球</option></select></div><div class="field"><label>主隊名稱</label><input id="homeName" value="Tigers" maxlength="15"></div><div class="field"><label>客隊名稱</label><input id="awayName" value="Lions" maxlength="15"></div><div class="field"><label>場地 / 場次</label><input id="venue" value="主場館 · A 場"></div><div class="startbottom"><button class="primary" onclick="begin()">開始比賽　→</button></div></div></section><section id="production"><div class="prod"><div class="view" id="view"><video id="camera" autoplay muted playsinline></video><div class="focus" id="focus"><span>AF/AE</span></div></div><div class="side left"><button onclick="panel('score')"><span class="pict">▦</span>比分</button><button onclick="panel('clock')"><span class="pict">◷</span>計時</button><button onclick="panel('more')"><span class="pict">•••</span>更多</button></div><div class="side right"><button id="recBtn" onclick="stateToggle('rec')"><span class="pict">⦿</span>錄影</button><button id="liveBtn" onclick="stateToggle('live')"><span class="pict">◉</span>直播</button><button onclick="panel('camera')"><span class="pict">▣</span>相機</button></div><div class="zoom"><div class="zoomdial" id="zoomDial"><b id="zoomRead">1.0×</b><input id="zoomSlider" type="range" min="1" max="5" step="0.1" value="1" oninput="zoomMove(this.value)"><div class="muted">此版本為倍率操作原型</div></div><button class="chosen" data-z="1">1×</button><button data-z="3">3×</button><button data-z="5">5×</button></div><div class="scorebug" onclick="panel('score')"><span id="bugHome">Tigers</span><strong id="bugH">0</strong><span class="clock"><span id="bugPeriod">Q1</span><b id="bugTime">10:00</b></span><strong id="bugA">0</strong><span id="bugAway">Lions</span></div><div class="overlay" id="overlay" onclick="if(event.target===this)closePanel()"><div class="dialog"><div class="dtop"><b id="panelTitle">比賽控制</b><button class="close" onclick="closePanel()">×</button></div><div id="panelBody"></div></div></div><div class="rotate"><div><div style="font-size:45px">↻</div><h2>請將手機轉為橫式</h2><p class="muted">比賽攝影畫面使用橫向操作</p><button onclick="page('setup')">返回比賽設定</button></div></div></div></section><script>const el=id=>document.getElementById(id);let home=0,away=0,seconds=600,period=1,running=false,timer=null,stream=null,zoom=1,hold=null,focusTimer=null;function page(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));el(id).classList.add('active');if(id!=='home')document.querySelector('.nav')?.remove()}function notice(message){let t=el('toast');t.textContent=message;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2100)}function render(){el('bugH').textContent=home;el('bugA').textContent=away;el('bugPeriod').textContent='Q'+period;let m=Math.floor(seconds/60),s=seconds%60;el('bugTime').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(el('panelTitle').textContent==='比分與計時'||el('panelTitle').textContent==='比賽計時'){el('panelClock').textContent=el('bugTime').textContent;let p=el('panelPeriod');if(p)p.textContent='Q'+period}}async function begin(){el('bugHome').textContent=el('homeName').value||'HOME';el('bugAway').textContent=el('awayName').value||'AWAY';page('production');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('browser');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});el('camera').srcObject=stream;el('view').classList.add('real')}catch(e){notice('相機無法啟用，仍可操作 UI 示意畫面')}}function points(w,n){if(w==='h')home=Math.max(0,home+n);else away=Math.max(0,away+n);render()}function tick(){if(seconds>0){seconds--;render()}else{running=false;clearInterval(timer);notice('本節時間結束')}}function toggleClock(){running=!running;clearInterval(timer);if(running)timer=setInterval(tick,1000);panel('score')}function panel(type){el('overlay').classList.add('show');let body='',title='';if(type==='score'||type==='clock'){title=type==='clock'?'比賽計時':'比分與計時';body='<div class="scores"><div><div class="muted">'+el('bugHome').textContent+'</div><h2>'+home+'</h2><div class="points">'+[-1,1,2,3].map(n=>'<button onclick="points(\'h\','+n+')">'+(n>0?'+':'')+n+'</button>').join('')+'</div></div><div><div class="muted" id="panelPeriod">Q'+period+'</div><div class="midclock" id="panelClock">'+el('bugTime').textContent+'</div><button class="clockbutton" onclick="toggleClock()">'+(running?'Ⅱ':'▶')+'</button></div><div><div class="muted">'+el('bugAway').textContent+'</div><h2>'+away+'</h2><div class="points">'+[-1,1,2,3].map(n=>'<button onclick="points(\'a\','+n+')">'+(n>0?'+':'')+n+'</button>').join('')+'</div></div></div><div class="muted" style="text-align:center;margin-top:16px">按比分加減分；中央按鈕開始／暫停計時</div>'}else if(type==='camera'){title='相機設定';body='<div class="options"><label>影片品質</label><select><option>1080p · 30fps（原型建議）</option><option>720p · 30fps</option></select><label>對焦</label><select><option>點畫面設定對焦圈（UI 示意）</option></select><label>影像參數</label><select><option>自動曝光 / 自動白平衡</option><option>專業手動模式（後續版本）</option></select></div>'}else{title='更多';body='<div class="options"><label>目前節數</label><select onchange="period=Number(this.value);render()">'+[1,2,3,4].map(x=>'<option value="'+x+'" '+(x===period?'selected':'')+'>Q'+x+'</option>').join('')+'</select><button class="primary" style="margin-top:10px" onclick="closePanel();if(confirm(\'確定結束比賽？\')){clearInterval(timer);running=false;stream?.getTracks().forEach(t=>t.stop());page(\'home\')}">結束比賽</button></div>'}el('panelTitle').textContent=title;el('panelBody').innerHTML=body}function closePanel(){el('overlay').classList.remove('show')}function stateToggle(kind){notice(kind==='rec'?'錄影尚未接入影片輸出（UI 示意）':'直播尚未接入推流服務（UI 示意）')}function zoomMove(v){zoom=Number(v);el('zoomRead').textContent=zoom.toFixed(1)+'×';document.querySelectorAll('.zoom>button').forEach(b=>b.classList.toggle('chosen',Number(b.dataset.z)===zoom))}document.querySelectorAll('.zoom>button').forEach(b=>{let open=false;b.addEventListener('pointerdown',e=>{open=false;hold=setTimeout(()=>{open=true;el('zoomDial').classList.add('show');zoomMove(b.dataset.z)},360)});b.addEventListener('pointerup',()=>{clearTimeout(hold);if(!open){zoomMove(b.dataset.z);notice('倍率 '+zoom+'× · UI 示意')}});b.addEventListener('pointercancel',()=>clearTimeout(hold));b.addEventListener('contextmenu',e=>e.preventDefault())});el('zoomSlider').addEventListener('change',()=>setTimeout(()=>el('zoomDial').classList.remove('show'),500));el('view').addEventListener('pointerdown',e=>{let rect=el('view').getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let f=el('focus');f.style.left=x+'px';f.style.top=y+'px';f.classList.add('show');clearTimeout(focusTimer);focusTimer=setTimeout(()=>f.classList.remove('show'),1800)});el('view').addEventListener('pointermove',e=>{if(e.buttons){let r=el('view').getBoundingClientRect();el('focus').style.left=(e.clientX-r.left)+'px';el('focus').style.top=(e.clientY-r.top)+'px'}});render();</script></body></html>
